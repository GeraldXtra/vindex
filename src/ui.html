<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src file: 'unsafe-inline'; img-src file: data:; media-src file:; connect-src file:">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vindex</title>

        <!-- Load dependency css -->
        <link rel="stylesheet" href="node_modules/augmented-ui/augmented.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/barlow-semi-condensed/latin-400.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/barlow-semi-condensed/latin-500.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/barlow-semi-condensed/latin-600.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-400.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-500.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-700.css" />
        <link rel="stylesheet" href="node_modules/@fontsource/doto/latin-900.css" />
        <link rel="stylesheet" href="node_modules/xterm/css/xterm.css" />
        <!-- Load main css -->
        <link rel="stylesheet" href="assets/css/vindex.css" />
        <link rel="stylesheet" href="assets/css/modal.css" />
        <link rel="stylesheet" href="assets/css/boot.css" />

        <!-- Load dependency js -->
        <script src="node_modules/xterm/lib/xterm.js"></script>
        <script src="node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
        <script src="node_modules/xterm-addon-webgl/lib/xterm-addon-webgl.js"></script>
        <script src="node_modules/howler/dist/howler.js"></script>
        <!-- Load main modules classes -->
        <script src="classes/modal.class.js"></script>
        <script src="classes/terminal.class.js"></script>
        <script src="classes/keyboard.class.js"></script>
        <!-- Load extra classes -->
        <script src="classes/audiofx.class.js"></script>
        <script src="classes/bootScreen.class.js"></script>
    </head>
    <body class="solidBackground">
        <section id="boot_screen">
        </section>
        <div id="vx-app">
            <header class="vx-header">
                <div class="vx-brand">
                    <svg class="vx-logo" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24"><rect class="vx-logo-shape" x="1" y="1" width="22" height="22" stroke-width="2.4"></rect><path class="vx-logo-shape" d="M5.5 7.5L10 12L5.5 16.5" stroke-width="3"></path><path class="vx-logo-shape" d="M12 16.5H18.5" stroke-width="3"></path></svg>
                    <span class="vx-wordmark">VINDEX</span>
                    <span id="vx-version" class="vx-version"></span>
                </div>
                <nav id="vx-tabs" class="vx-tabs" aria-label="Terminal tabs">
                    <button id="vx-new-tab" class="vx-new-tab" type="button" aria-label="New tab"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path class="vx-new-tab-icon" d="M6 1v10M1 6h10" stroke-width="1"></path></svg></button>
                </nav>
                <div class="vx-spacer"></div>
                <div class="vx-status">
                    <span class="vx-stat"><span class="vx-stat-label">UPTIME</span><span id="vx-uptime" class="vx-uptime"></span></span>
                    <span id="vx-battery" class="vx-battery" hidden>
                        <span class="vx-stat-label">BAT</span>
                        <span id="vx-battery-bars" class="vx-battery-bars" aria-hidden="true"><span class="vx-battery-bar"></span><span class="vx-battery-bar"></span><span class="vx-battery-bar"></span><span class="vx-battery-bar"></span><span class="vx-battery-bar"></span></span>
                        <span id="vx-battery-level" class="vx-battery-level"></span>
                        <span id="vx-battery-state" class="vx-battery-state"></span>
                    </span>
                    <span class="vx-theme"><span class="vx-theme-swatch" aria-hidden="true"></span><span id="vx-theme-name"></span></span>
                    <span class="vx-stat"><span class="vx-stat-label">LOCAL</span><span id="vx-clock-local" class="vx-clock"></span></span>
                    <span class="vx-stat"><span class="vx-stat-label">UTC</span><span id="vx-clock-utc" class="vx-clock vx-clock-utc"></span></span>
                </div>
            </header>
            <main class="vx-main">
                <div class="vx-column vx-column-left">
                    <section class="vx-panel vx-panel-fill vx-panel-explorer" aria-label="Explorer">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">01</span><span class="vx-panel-title">EXPLORER</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                    <section class="vx-panel vx-panel-repository" aria-label="Repository">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">02</span><span class="vx-panel-title">REPOSITORY</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                    <section class="vx-panel vx-panel-security" aria-label="Security and privacy">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">03</span><span class="vx-panel-title">SECURITY</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                </div>
                <div class="vx-column vx-column-centre">
                    <section class="vx-panel vx-panel-fill vx-panel-terminal" aria-label="Terminal">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-term-head">
                            <span class="vx-panel-number">04</span>
                            <span class="vx-panel-title">TERMINAL</span>
                            <span id="vx-term-shell" class="vx-term-shell"></span>
                            <span class="vx-rule" aria-hidden="true"></span>
                            <span id="vx-term-size" class="vx-chip"></span>
                            <span id="vx-term-renderer" class="vx-chip"></span>
                        </div>
                        <div id="vx-term-body">
                            <div id="terminal0" class="vx-term"></div>
                            <div id="terminal1" class="vx-term"></div>
                            <div id="terminal2" class="vx-term"></div>
                            <div id="terminal3" class="vx-term"></div>
                            <div id="terminal4" class="vx-term"></div>
                        </div>
                        <div class="vx-term-status">
                            <span id="vx-term-badge" class="vx-term-badge"></span>
                            <span id="vx-term-cwd" class="vx-term-cwd" hidden></span>
                            <span class="vx-spacer"></span>
                            <span class="vx-term-cell">SCROLLBACK 1500</span>
                            <span id="vx-term-input" class="vx-term-cell"></span>
                        </div>
                    </section>
                    <section class="vx-panel vx-panel-keyboard" aria-label="On-screen keyboard">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-kb-head">
                            <span class="vx-kb-title"><span class="vx-panel-number">05</span><span class="vx-panel-title">KEYBOARD</span></span>
                            <span id="vx-kb-layout" class="vx-kb-layout"></span>
                            <span class="vx-inds">
                                <span class="vx-ind" data-mod="ctrl"><span class="vx-ind-mark" aria-hidden="true"></span>CTRL</span>
                                <span class="vx-ind" data-mod="alt"><span class="vx-ind-mark" aria-hidden="true"></span>ALT</span>
                                <span class="vx-ind" data-mod="shift"><span class="vx-ind-mark" aria-hidden="true"></span>SHIFT</span>
                                <span class="vx-ind" data-mod="caps"><span class="vx-ind-mark" aria-hidden="true"></span>CAPS</span>
                                <span class="vx-ind" data-mod="fn"><span class="vx-ind-mark" aria-hidden="true"></span>FN</span>
                            </span>
                        </div>
                        <div id="keyboard"></div>
                    </section>
                </div>
                <div class="vx-column vx-column-right">
                    <section class="vx-panel vx-panel-system" aria-label="System">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">06</span><span class="vx-panel-title">SYSTEM</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                    <section class="vx-panel vx-panel-cpu" aria-label="CPU">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">07</span><span class="vx-panel-title">CPU</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                    <section class="vx-panel vx-panel-network" aria-label="Network">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">08</span><span class="vx-panel-title">NETWORK</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                    <section class="vx-panel vx-panel-fill vx-panel-processes" aria-label="Processes">
                        <span class="vx-corner vx-corner-tl" aria-hidden="true"></span><span class="vx-corner vx-corner-tr" aria-hidden="true"></span><span class="vx-corner vx-corner-bl" aria-hidden="true"></span><span class="vx-corner vx-corner-br" aria-hidden="true"></span>
                        <div class="vx-panel-head"><span class="vx-panel-number">09</span><span class="vx-panel-title">PROCESSES</span><span class="vx-rule" aria-hidden="true"></span></div>
                        <div class="vx-placeholder">NOT BUILT YET</div>
                    </section>
                </div>
            </main>
            <footer class="vx-footer">
                <div class="vx-footer-group"><span id="vx-footer-renderer" class="vx-footer-text"></span><span id="vx-footer-versions" class="vx-footer-text"></span></div>
                <div class="vx-footer-group vx-footer-group-right"><span id="vx-footer-sfx" class="vx-footer-text"></span></div>
            </footer>
        </div>

        <script src="_renderer.js"></script>
    </body>
</html>
